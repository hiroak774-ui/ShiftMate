<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" sizes="180x180" href="https://hiroak774-ui.github.io/ShiftMate/shiftmate-apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://hiroak774-ui.github.io/ShiftMate/shiftmate-icon-512.png">
<meta name="apple-mobile-web-app-title" content="ShiftMate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5faf8">
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ShiftMate</title>

  <style>
    :root {
      --mint: #53cbb1;
      --mint-dark: #2ea98f;
      --mint-soft: #eaf9f5;
      --mint-line: #ccefe6;
      --text: #25332f;
      --sub: #75817d;
      --line: #e7ecea;
      --error: #d95d5d;
      --error-bg: #fff3f3;
      --shadow: 0 20px 60px rgba(40, 80, 70, .10);
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family:
        -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(83, 203, 177, .12), transparent 32%),
        #f8fbfa;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(28px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));
    }

    .shell {
      width: min(100%, 420px);
      opacity: 0;
      transform: translateY(14px);
      animation: enter .62s cubic-bezier(.22, .8, .25, 1) forwards;
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .brand-lockup {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .brand-logo {
      display: block;
      width: min(250px, 68vw);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(46, 169, 143, .10));
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 30px 24px 24px;
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(225, 235, 232, .95);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--mint), transparent);
      opacity: .72;
    }

    .view {
      transition: opacity .22s ease, transform .22s ease;
    }

    .view.is-leaving {
      opacity: 0;
      transform: translateY(-5px);
    }

    .heading {
      margin-bottom: 26px;
      text-align: center;
    }

    .heading h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.35;
      letter-spacing: -.35px;
    }

    .heading p {
      margin: 8px 0 0;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.65;
    }

    .form {
      display: grid;
      gap: 17px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      padding-left: 2px;
      font-size: 13px;
      font-weight: 650;
      color: #4b5a55;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      height: 54px;
      padding: 0 48px 0 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      outline: none;
      color: var(--text);
      background: #fbfdfc;
      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease,
        transform .18s ease;
    }

    .input-wrap input::placeholder {
      color: #b1bab7;
    }

    .input-wrap input:focus {
      border-color: var(--mint);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(83, 203, 177, .13);
    }

    .input-wrap input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px #fbfdfc inset;
      -webkit-text-fill-color: var(--text);
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      border-radius: 11px;
      background: transparent;
      color: #8a9692;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }

    .toggle-password:hover,
    .toggle-password:focus-visible {
      background: var(--mint-soft);
      color: var(--mint-dark);
      outline: none;
    }

    .toggle-password svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .message {
      display: none;
      min-height: 44px;
      padding: 11px 13px;
      border: 1px solid #ffd8d8;
      border-radius: 12px;
      color: #b74646;
      background: var(--error-bg);
      font-size: 13px;
      line-height: 1.55;
    }

    .message.show {
      display: block;
      animation: messageIn .22s ease both;
    }

    .submit {
      position: relative;
      width: 100%;
      height: 54px;
      margin-top: 2px;
      border-radius: var(--radius-md);
      color: #fff;
      background: linear-gradient(135deg, #5bd0b7, #3eb89e);
      box-shadow: 0 12px 24px rgba(46, 169, 143, .22);
      font-weight: 720;
      letter-spacing: .02em;
      cursor: pointer;
      overflow: hidden;
      transition:
        transform .16s ease,
        box-shadow .16s ease,
        opacity .16s ease;
    }

    .submit::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -35%;
      width: 25%;
      height: 220%;
      transform: rotate(18deg);
      background: rgba(255, 255, 255, .22);
      transition: left .5s ease;
    }

    .submit:hover::after {
      left: 120%;
    }

    .submit:active {
      transform: scale(.985);
      box-shadow: 0 7px 16px rgba(46, 169, 143, .19);
    }

    .submit:disabled {
      cursor: wait;
      opacity: .78;
    }

    .submit-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .spinner {
      display: none;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255, 255, 255, .42);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .72s linear infinite;
    }

    .submit.loading .spinner {
      display: inline-block;
    }

    .submit.loading .normal-label {
      display: none;
    }

    .submit .loading-label {
      display: none;
    }

    .submit.loading .loading-label {
      display: inline;
    }

    .help {
      margin: 18px 0 0;
      color: #98a29f;
      text-align: center;
      font-size: 11.5px;
      line-height: 1.7;
    }

    .password-guide {
      margin: -2px 0 0;
      padding: 12px 14px;
      border-radius: 12px;
      color: #6e7b77;
      background: #f6faf9;
      font-size: 12px;
      line-height: 1.65;
    }

    .footer {
      margin-top: 19px;
      color: #a4aeab;
      text-align: center;
      font-size: 10.5px;
      letter-spacing: .04em;
    }

    @keyframes enter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .app {
        place-items: center;
        padding-left: 16px;
        padding-right: 16px;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-logo {
        width: min(225px, 72vw);
      }

      .card {
        padding: 27px 20px 22px;
        border-radius: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  
.startup-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#f6faf8;opacity:1;visibility:visible;transition:opacity .28s ease,visibility .28s ease}
.startup-splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.startup-inner{text-align:center}
.startup-mark{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:#fff;box-shadow:0 18px 46px rgba(40,112,92,.14);animation:startupFloat 1.7s ease-in-out infinite}
.startup-mark img{width:58px;height:58px;object-fit:contain;border-radius:17px}
.startup-title{font-size:18px;font-weight:850;letter-spacing:-.2px}
.startup-copy{margin-top:7px;color:var(--sub);font-size:12px}
.startup-line{width:136px;height:4px;margin:18px auto 0;overflow:hidden;border-radius:99px;background:#dfeee9}
.startup-line::after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:var(--mint);animation:startupLine 1.05s ease-in-out infinite}
@keyframes startupFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes startupLine{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}

</style>
  <script src="./config.js"></script>
  <script src="./api-client.js"></script>
<style>
html{opacity:0;transform:translateY(5px)}
html.sm-page-ready{opacity:1;transform:none;transition:opacity .24s ease,transform .24s cubic-bezier(.22,.8,.25,1)}
html.sm-page-leaving{opacity:0;transform:translateY(-4px);transition:opacity .14s ease,transform .14s ease}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent}
button:active,a:active,[role="button"]:active{transform:scale(.98)}
@media(prefers-reduced-motion:reduce){
 html,html.sm-page-ready,html.sm-page-leaving{opacity:1;transform:none;transition:none!important}
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
<script src="./motion.js"></script>
</head>

        <div class="view" id="changeView" hidden>
          <div class="heading">
            <h1>パスワード変更</h1>
            <p>初回ログインのため、新しいパスワードを設定してください。</p>
          </div>

          <form class="form" id="changeForm" novalidate>
            <div class="field">
              <label for="currentPassword">現在のパスワード</label>
              <div class="input-wrap">
                <input
                  id="currentPassword"
                  name="currentPassword"
                  type="password"
                  autocomplete="current-password"
                  placeholder="仮パスワードを入力"
                  maxlength="128"
                  required
                >
                <button class="toggle-password" type="button" data-target="currentPassword" aria-label="パスワードを表示">
                  <svg viewBox="0 0 24 24">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                    <circle cx="12" cy="12" r="2.8"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="field">
              <label for="newPassword">新しいパスワード</label>
              <div class="input-wrap">
                <input
                  id="newPassword"
                  name="newPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="新しいパスワード"
                  maxlength="128"
                  required
                >
                <button class="toggle-password" type="button" data-target="newPassword" aria-label="パスワードを表示">
                  <svg viewBox="0 0 24 24">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                    <circle cx="12" cy="12" r="2.8"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="field">
              <label for="confirmPassword">新しいパスワード（確認）</label>
              <div class="input-wrap">
                <input
                  id="confirmPassword"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="もう一度入力"
                  maxlength="128"
                  required
                >
                <button class="toggle-password" type="button" data-target="confirmPassword" aria-label="パスワードを表示">
                  <svg viewBox="0 0 24 24">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                    <circle cx="12" cy="12" r="2.8"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="password-guide">
              10文字以上で、英字と数字をそれぞれ1文字以上含めてください。
            </div>

            <div class="message" id="changeMessage" role="alert"></div>

            <button class="submit" id="changeButton" type="submit">
              <span class="submit-content">
                <span class="spinner" aria-hidden="true"></span>
                <span class="normal-label">変更して続ける</span>
                <span class="loading-label">変更しています</span>
              </span>
            </button>
          </form>
        </div>
      </section>

      <div class="footer">ShiftMate</div>
    </div>
  </main>

  <script>
    'use strict';

    const STORAGE_KEY = 'shiftmate_session_token';
    const LAST_PAGE_KEY = 'shiftmate_last_page';
    const ROLE_ADMIN = 'admin';
    const ROLE_STAFF = 'staff';

    const state = {
      sessionToken: '',
      user: null,
      loginPassword: '',
      manualLoginEnabled: false
    };

    const el = {
      shell: document.getElementById('shell'),
      loginView: document.getElementById('loginView'),
      changeView: document.getElementById('changeView'),
      loginForm: document.getElementById('loginForm'),
      changeForm: document.getElementById('changeForm'),
      email: document.getElementById('email'),
      password: document.getElementById('password'),
      currentPassword: document.getElementById('currentPassword'),
      newPassword: document.getElementById('newPassword'),
      confirmPassword: document.getElementById('confirmPassword'),
      loginMessage: document.getElementById('loginMessage'),
      changeMessage: document.getElementById('changeMessage'),
      loginButton: document.getElementById('loginButton'),
      changeButton: document.getElementById('changeButton'),
      startupSplash: document.getElementById('startupSplash'),
      startupCopy: document.getElementById('startupCopy')
    };

    document.addEventListener('DOMContentLoaded', initialize);

    function initialize() {
      bindEvents();
      installStartupFocusGuard();
      setManualLoginEnabled(false);
      blurActiveElement();

      const existingToken = safeStorageGet(STORAGE_KEY);
      if (!existingToken) {
        showManualLogin();
        return;
      }

      el.startupCopy.textContent = 'ログイン情報を確認しています';
      callGas('apiResolveLaunch', existingToken, safeStorageGet(LAST_PAGE_KEY))
        .then((response) => {
          const data = unwrapResponse(response);
          state.sessionToken = existingToken;
          state.user = data.user;
          routeByRole(data.user, data.screen, 'startup');
        })
        .catch(() => {
          safeStorageRemove(STORAGE_KEY);
          showManualLogin();
        });
    }

    function showManualLogin() {
      blurActiveElement();
      setManualLoginEnabled(true);
      hideStartupSplash();
    }

    function setManualLoginEnabled(enabled) {
      state.manualLoginEnabled = Boolean(enabled);

      if (el.loginForm) {
        if (enabled) {
          el.loginForm.removeAttribute('inert');
          el.loginForm.setAttribute('aria-hidden', 'false');
        } else {
          el.loginForm.setAttribute('inert', '');
          el.loginForm.setAttribute('aria-hidden', 'true');
        }
      }

      if (el.email) {
        el.email.disabled = !enabled;
        el.email.readOnly = !enabled;
        el.email.tabIndex = enabled ? 0 : -1;
        el.email.setAttribute('inputmode', enabled ? 'email' : 'none');
        el.email.setAttribute('autocomplete', enabled ? 'username' : 'off');
      }

      if (el.password) {
        el.password.disabled = !enabled;
        el.password.readOnly = !enabled;
        el.password.tabIndex = enabled ? 0 : -1;
        el.password.setAttribute('inputmode', enabled ? 'text' : 'none');
        el.password.setAttribute('autocomplete', enabled ? 'current-password' : 'off');
      }

      const passwordToggle = document.querySelector('[data-target="password"]');
      if (passwordToggle) {
        passwordToggle.disabled = !enabled;
        passwordToggle.tabIndex = enabled ? 0 : -1;
      }

      if (el.loginButton) {
        el.loginButton.disabled = !enabled;
        el.loginButton.tabIndex = enabled ? 0 : -1;
        el.loginButton.setAttribute('aria-disabled', enabled ? 'false' : 'true');
      }

      if (!enabled) blurActiveElement();
    }

    function installStartupFocusGuard() {
      const keepKeyboardClosed = (event) => {
        if (state.manualLoginEnabled) return;
        const target = event && event.target;
        if (target && el.loginForm && el.loginForm.contains(target)) {
          if (typeof target.blur === 'function') target.blur();
          if (event.cancelable) event.preventDefault();
        }
      };

      document.addEventListener('focusin', keepKeyboardClosed, true);
      document.addEventListener('touchstart', keepKeyboardClosed, { capture: true, passive: false });
      window.addEventListener('pageshow', () => {
        if (!state.manualLoginEnabled) {
          window.setTimeout(blurActiveElement, 0);
          window.setTimeout(blurActiveElement, 120);
        }
      });
    }

    function blurActiveElement() {
      const active = document.activeElement;
      if (active && typeof active.blur === 'function') active.blur();
    }

    function hideStartupSplash() {
      if (!el.startupSplash) return;
      el.startupSplash.classList.add('hidden');
      window.setTimeout(() => el.startupSplash.remove(), 320);
    }

    function showRoleLoading(user) {
      if (!el.startupSplash) return;
      const role = String(user && user.role || '').toLowerCase();
      el.startupCopy.textContent = role === ROLE_ADMIN
        ? '店舗情報を準備しています'
        : 'シフト情報を準備しています';
      el.startupSplash.classList.remove('hidden');
    }

    function bindEvents() {
      el.loginForm.addEventListener('submit', handleLogin);
      el.changeForm.addEventListener('submit', handlePasswordChange);

      document.querySelectorAll('.toggle-password').forEach((button) => {
        button.addEventListener('click', () => togglePassword(button));
      });
    }

    async function handleLogin(event) {
      event.preventDefault();
      clearMessage(el.loginMessage);

      const email = el.email.value.trim();
      const password = el.password.value;

      if (!email || !password) {
        showMessage(el.loginMessage, 'メールアドレスとパスワードを入力してください。');
        return;
      }

      if (!isValidEmail(email)) {
        showMessage(el.loginMessage, 'メールアドレスの形式を確認してください。');
        el.email.focus();
        return;
      }

      state.loginPassword = password;
      setLoading(el.loginButton, true);

      try {
        const response = await callGas(
          'apiLogin',
          email,
          password,
          getDeviceInfo()
        );
        const data = unwrapResponse(response);

        state.sessionToken = data.sessionToken;
        state.user = data.user;
        safeStorageSet(STORAGE_KEY, data.sessionToken);

        if (data.firstPasswordChangeRequired) {
          showPasswordChange();
          return;
        }

        routeByRole(data.user, null, 'login');
      } catch (error) {
        safeStorageRemove(STORAGE_KEY);
        showMessage(el.loginMessage, readableError(error));
        setLoading(el.loginButton, false);
      }
    }

    async function handlePasswordChange(event) {
      event.preventDefault();
      clearMessage(el.changeMessage);

      const currentPassword = el.currentPassword.value;
      const newPassword = el.newPassword.value;
      const confirmPassword = el.confirmPassword.value;

      if (!currentPassword || !newPassword || !confirmPassword) {
        showMessage(el.changeMessage, 'すべての項目を入力してください。');
        return;
      }

      if (!isValidPassword(newPassword)) {
        showMessage(
          el.changeMessage,
          '新しいパスワードは10文字以上で、英字と数字を含めてください。'
        );
        el.newPassword.focus();
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage(el.changeMessage, '新しいパスワードが一致していません。');
        el.confirmPassword.focus();
        return;
      }

      setLoading(el.changeButton, true);

      try {
        const response = await callGas(
          'apiChangePassword',
          state.sessionToken,
          currentPassword,
          newPassword
        );
        const data = unwrapResponse(response);

        state.sessionToken = data.sessionToken;
        safeStorageSet(STORAGE_KEY, data.sessionToken);

        routeByRole(state.user, null, 'login');
      } catch (error) {
        showMessage(el.changeMessage, readableError(error));
        setLoading(el.changeButton, false);
      }
    }

    function showPasswordChange() {
      el.loginView.classList.add('is-leaving');

      setTimeout(() => {
        el.loginView.hidden = true;
        el.loginView.classList.remove('is-leaving');
        el.changeView.hidden = false;

        el.currentPassword.value = state.loginPassword;
        state.loginPassword = '';

        requestAnimationFrame(() => {
          el.changeView.style.opacity = '0';
          el.changeView.style.transform = 'translateY(7px)';

          requestAnimationFrame(() => {
            el.changeView.style.opacity = '1';
            el.changeView.style.transform = 'translateY(0)';
            el.changeView.style.transition = 'opacity .24s ease, transform .24s ease';
          });
        });

        setLoading(el.loginButton, false);
        setTimeout(() => el.newPassword.focus(), 180);
      }, 210);
    }

    function routeByRole(user, resolvedScreen, reason = 'resume') {
      const role = String(user && user.role || '').toLowerCase();

      if (role !== ROLE_ADMIN && role !== ROLE_STAFF) {
        safeStorageRemove(STORAGE_KEY);
        setManualLoginEnabled(true);
        hideStartupSplash();
        showMessage(el.loginMessage, 'ユーザー権限を確認できませんでした。管理者へお問い合わせください。');
        setLoading(el.loginButton, false);
        return;
      }

      const savedPage = safeStorageGet(LAST_PAGE_KEY);
      const page = role === ROLE_ADMIN
        ? (resolvedScreen === 'staff' || (!resolvedScreen && savedPage === 'staff') ? 'staff' : 'admin')
        : 'staff';

      if (role === ROLE_ADMIN) safeStorageSet(LAST_PAGE_KEY, page);

      if (reason === 'login') {
        showRoleLoading(user);
      } else if (reason === 'startup' && el.startupCopy) {
        el.startupCopy.textContent = role === ROLE_ADMIN
          ? '管理者画面を開いています'
          : 'スタッフ画面を開いています';
      }

      sessionStorage.setItem(
        'shiftmate_transition',
        reason === 'login' ? 'initial-login' : 'startup-resume'
      );

      window.setTimeout(() => {
        window.location.href = page === 'admin' ? './admin.html' : './staff.html';
      }, reason === 'login' ? 280 : 120);
    }

    function togglePassword(button) {
      const target = document.getElementById(button.dataset.target);
      if (!target) return;

      const willShow = target.type === 'password';
      target.type = willShow ? 'text' : 'password';
      button.setAttribute('aria-label', willShow ? 'パスワードを隠す' : 'パスワードを表示');
    }

    function callGas(functionName, ...args) {
      return window.ShiftMateAPI.call(functionName, ...args);
    }

    function unwrapResponse(response) {
      if (!response) {
        throw new Error('サーバーから応答がありませんでした。');
      }

      if (response.success === false || response.ok === false) {
        const message =
          response.message ||
          (response.error && response.error.message) ||
          '処理に失敗しました。';
        throw new Error(message);
      }

      return Object.prototype.hasOwnProperty.call(response, 'data')
        ? response.data
        : response;
    }

    function readableError(error) {
      const raw = String(
        error && (error.message || error.details || error) ||
        ''
      );

      if (raw.includes('GAS_WEB_APP_REQUIRED')) {
        return 'この画面はGASのウェブアプリから開いてください。';
      }

      const cleaned = raw
        .replace(/^Exception:\s*/i, '')
        .replace(/^Error:\s*/i, '')
        .trim();

      return cleaned || '通信に失敗しました。時間をおいて再度お試しください。';
    }

    function setLoading(button, loading) {
      button.disabled = loading;
      button.classList.toggle('loading', loading);
      button.setAttribute('aria-busy', loading ? 'true' : 'false');
    }

    function showMessage(target, message) {
      target.textContent = message;
      target.classList.add('show');
    }

    function clearMessage(target) {
      target.textContent = '';
      target.classList.remove('show');
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function isValidPassword(password) {
      return password.length >= 10 &&
        /[A-Za-z]/.test(password) &&
        /\d/.test(password);
    }

    function getDeviceInfo() {
      return [
        navigator.platform || '',
        navigator.userAgent || '',
        screen.width + 'x' + screen.height
      ].filter(Boolean).join(' | ').slice(0, 500);
    }

    function safeStorageGet(key) {
      try {
        return localStorage.getItem(key) || '';
      } catch (_) {
        return '';
      }
    }

    function safeStorageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (_) {}
    }

    function safeStorageRemove(key) {
      try {
        localStorage.removeItem(key);
      } catch (_) {}
    }
  </script>
</body>
</html>
